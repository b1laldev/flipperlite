name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: C host tests
        run: make -C firmware/host test
      - name: Go vet and tests
        run: cd server && go vet ./... && go test ./...
